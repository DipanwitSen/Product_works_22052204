<!DOCTYPE html>
<html>
  <head>
    <title>Admin Dashboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #fff3e6;
        text-align: center;
      }
      .box {
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        width: 600px;
        margin: 50px auto;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
      }
      th {
        background: #ffd1a1;
      }
      a {
        margin-top: 15px;
        display: inline-block;
        background: #ffa45c;
        padding: 10px;
        border-radius: 8px;
        text-decoration: none;
        color: #000;
      }
      a:hover {
        background: #ff8c33;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Admin Dashboard</h2>
      <table>
        <tr>
          <th>Username</th>
          <th>Email</th>
          <th>Role</th>
        </tr>
        {% for u in users %}
        <tr>
          <td>{{ u[0] }}</td>
          <td>{{ u[1] }}</td>
          <td>{{ u[2] }}</td>
        </tr>
        {% endfor %}
      </table>
      <a href="{{ url_for('home') }}">Back to Home</a>
    </div>
  </body>
</html>
